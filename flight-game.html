<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ 飞越天际 - 飞行模拟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans SC', 'Orbitron', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #gameContainer {
            position: relative;
            width: 900px;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 100px rgba(0,191,255,0.2);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(20, 40, 80, 0.95);
            z-index: 20;
            transition: opacity 0.5s;
        }
        
        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 30px rgba(0,191,255,0.8);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }
        
        h2 {
            font-size: 20px;
            color: #00BFFF;
            margin-bottom: 30px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 6px;
        }
        
        .btn {
            padding: 18px 60px;
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(180deg, #00BFFF, #0080FF);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 8px 30px rgba(0,191,255,0.4);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,191,255,0.6);
        }
        
        .instructions {
            color: #88aacc;
            margin-top: 30px;
            font-size: 14px;
            text-align: center;
            line-height: 2.2;
        }
        
        .key {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(0,191,255,0.2);
            border-radius: 8px;
            margin: 0 5px;
            border: 1px solid rgba(0,191,255,0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
        }
        
        /* HUD - Left Panel */
        .hud-panel {
            position: absolute;
            pointer-events: none;
        }
        
        .hud-left {
            top: 60px;
            left: 15px;
        }
        
        .gauge-container {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 2px solid rgba(0,191,255,0.4);
            width: 140px;
        }
        
        .gauge-label {
            font-size: 10px;
            color: #00BFFF;
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        
        .gauge-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: white;
        }
        
        .gauge-unit {
            font-size: 12px;
            color: #00BFFF;
            margin-left: 5px;
        }
        
        .gauge-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .gauge-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.1s;
        }
        
        .throttle-fill {
            background: linear-gradient(90deg, #FF6B35, #FFD700);
        }
        
        .pitch-fill {
            background: linear-gradient(90deg, #00BFFF, #00FF80);
        }
        
        /* Right Panel - Speed & Altitude */
        .hud-right {
            top: 60px;
            right: 15px;
            text-align: right;
        }
        
        .big-gauge {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            border: 2px solid rgba(0,191,255,0.4);
            width: 150px;
        }
        
        .big-gauge .gauge-label {
            font-size: 11px;
        }
        
        .big-gauge .gauge-value {
            font-size: 36px;
        }
        
        /* Title */
        #titleBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(0,0,0,0));
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 10px;
        }
        
        #titleText {
            font-size: 14px;
            font-weight: 700;
            color: white;
            letter-spacing: 3px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        /* Bottom Progress */
        #bottomPanel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        
        #phaseText {
            font-size: 14px;
            color: #00BFFF;
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,191,255,0.5);
        }
        
        .progress-container {
            width: 350px;
            height: 18px;
            background: rgba(0,0,0,0.6);
            border-radius: 9px;
            overflow: hidden;
            border: 2px solid rgba(0,191,255,0.4);
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00BFFF, #00FF80);
            border-radius: 7px;
            transition: width 0.3s;
        }
        
        /* Message */
        #gameMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255,215,0,0.8);
            opacity: 0;
            transition: opacity 0.5s;
            font-family: 'Noto Sans SC', sans-serif;
            white-space: nowrap;
        }
        
        #gameMessage.show {
            opacity: 1;
        }
        
        /* Warning */
        .warning {
            color: #FF4444 !important;
            animation: blink 0.5s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div id="titleBar">
            <span id="titleText">✈️ 飞越天际 BEYOND THE HORIZON</span>
        </div>
        
        <div id="startScreen">
            <h1>✈️ 飞越天际</h1>
            <h2>BEYOND THE HORIZON</h2>
            <button class="btn" onclick="startGame()">开始飞行</button>
            <div class="instructions">
                <span class="key">W</span> 增加油门 &nbsp; <span class="key">S</span> 减少油门<br>
                <span class="key">↑</span> 拉起机头 &nbsp; <span class="key">↓</span> 下压机头<br><br>
                <b>通过控制油门来起飞、飞行和降落！</b>
            </div>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <h1 id="endTitle">飞行结束</h1>
            <h2 id="endSubtitle">成功降落！🛬</h2>
            <div class="gauge-container" style="width:180px;text-align:center;">
                <div class="gauge-label">飞行用时</div>
                <div class="gauge-value" id="finalTime">0:00</div>
            </div>
            <button class="btn" onclick="startGame()">再次起飞</button>
        </div>
        
        <!-- Left HUD -->
        <div class="hud-panel hud-left" id="hudLeft" style="display:none;">
            <div class="gauge-container">
                <div class="gauge-label">油门 THROTTLE</div>
                <div class="gauge-value"><span id="throttleVal">0</span><span class="gauge-unit">%</span></div>
                <div class="gauge-bar">
                    <div class="gauge-fill throttle-fill" id="throttleBar" style="width:0%"></div>
                </div>
            </div>
            <div class="gauge-container">
                <div class="gauge-label">仰角 PITCH</div>
                <div class="gauge-value"><span id="pitchVal">0</span><span class="gauge-unit">°</span></div>
                <div class="gauge-bar">
                    <div class="gauge-fill pitch-fill" id="pitchBar" style="width:50%"></div>
                </div>
            </div>
        </div>
        
        <!-- Right HUD -->
        <div class="hud-panel hud-right" id="hudRight" style="display:none;">
            <div class="big-gauge">
                <div class="gauge-label">空速 AIRSPEED</div>
                <div class="gauge-value"><span id="speedVal">0</span><span class="gauge-unit">kn</span></div>
            </div>
            <div class="big-gauge">
                <div class="gauge-label">高度 ALTITUDE</div>
                <div class="gauge-value"><span id="altVal">0</span><span class="gauge-unit">M</span></div>
            </div>
        </div>
        
        <!-- Bottom -->
        <div class="hud-panel" id="bottomPanel" style="display:none;">
            <div id="phaseText">等待起飞...</div>
            <div class="progress-container">
                <div class="progress-fill" id="progressBar" style="width:0%"></div>
            </div>
        </div>
        
        <div id="gameMessage"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameRunning = false;
        let gameTime = 0;
        let lastTime = 0;
        
        // Flight phases
        const PHASE = {
            TAXI: 0,
            TAKEOFF: 1,
            CLIMB: 2,
            CRUISE: 3,
            DESCENT: 4,
            APPROACH: 5,
            LANDING: 6,
            ROLLOUT: 7
        };
        let flightPhase = PHASE.TAXI;
        
        // Aircraft
        const plane = {
            x: 100,
            y: 0,           // Visual Y position
            altitude: 0,    // Real altitude
            speed: 0,        // Knots
            throttle: 0,    // 0-100%
            pitch: 0,       // -15 to +25 degrees
            roll: 0,
            distance: 0     // Total distance traveled
        };
        
        // Environment
        let clouds = [];
        let sunPos = { x: 750, y: 60 };
        
        // Input
        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(['w','s','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
        
        // Initialize
        function initWorld() {
            clouds = [];
            for(let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * canvas.width * 1.5,
                    y: 80 + Math.random() * 180,
                    size: 50 + Math.random() * 50,
                    speed: 0.3 + Math.random() * 0.4,
                    layer: Math.random() > 0.5 ? 1 : 2
                });
            }
        }
        
        // Draw sky
        function drawSky() {
            let gradient;
            if (flightPhase >= PHASE.DESCENT) {
                // Sunset
                gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#FF6B35');
                gradient.addColorStop(0.3, '#F7A59F');
                gradient.addColorStop(0.6, '#EFEFD0');
                gradient.addColorStop(1, '#87CEEB');
            } else {
                // Day
                gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#4A90D9');
                gradient.addColorStop(0.5, '#87CEEB');
                gradient.addColorStop(1, '#B8D4E8');
            }
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sun
            if(flightPhase < PHASE.DESCENT) {
                const sunGrad = ctx.createRadialGradient(sunPos.x, sunPos.y, 0, sunPos.x, sunPos.y, 60);
                sunGrad.addColorStop(0, '#FFFDE7');
                sunGrad.addColorStop(0.3, '#FFEB3B');
                sunGrad.addColorStop(1, 'rgba(255,235,59,0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(sunPos.x, sunPos.y, 60, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Draw clouds
        function drawClouds() {
            clouds.forEach(cloud => {
                // Move clouds based on plane speed
                cloud.x -= (plane.speed * 0.3 + cloud.speed) * 0.5;
                if(cloud.x < -100) cloud.x = canvas.width + 100;
                
                ctx.fillStyle = cloud.layer === 1 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.6)';
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size * 0.5, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.4, cloud.y - cloud.size * 0.15, cloud.size * 0.4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.8, cloud.y + cloud.size * 0.1, cloud.size * 0.35, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Draw ground/runway
        function drawGround() {
            const groundY = 420;
            
            // Ground (grass)
            ctx.fillStyle = '#5D8A4A';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            
            // Runway
            const runwayStart = 80;
            const runwayEnd = 350;
            const runwayY = groundY + 8;
            
            ctx.fillStyle = '#666';
            ctx.fillRect(runwayStart, runwayY, runwayEnd - runwayStart, 35);
            
            // Runway markings
            ctx.fillStyle = '#FFF';
            for(let i = 0; i < 8; i++) {
                ctx.fillRect(runwayStart + 25 + i * 35, runwayY + 13, 20, 3);
            }
            
            // Threshold markings
            ctx.fillStyle = '#FF0';
            ctx.fillRect(runwayStart + 10, runwayY + 5, 8, 25);
            ctx.fillRect(runwayEnd - 18, runwayY + 5, 8, 25);
        }
        
        // Draw airplane
        function drawPlane() {
            // Calculate screen position
            // Plane stays centered horizontally, world scrolls
            const screenX = 200;
            
            // Visual Y position based on altitude
            // At altitude 0, plane is on runway (y ~ 400)
            // At altitude 1000, plane is at top (y ~ 100)
            const baseY = 400;
            const yOffset = Math.min(300, plane.altitude * 0.3);
            const screenY = baseY - yOffset;
            
            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(plane.roll * Math.PI / 180);
            ctx.rotate(plane.pitch * Math.PI / 180);
            
            // Airplane shadow on ground (when low altitude)
            if(plane.altitude < 100) {
                const shadowY = 420 + 8 - (screenY - (baseY - yOffset));
                if(shadowY < 450) {
                    ctx.fillStyle = 'rgba(0,0,0,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(0, 35 + yOffset * 0.35, 45, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Fuselage
            const fusGrad = ctx.createLinearGradient(-55, 0, 55, 0);
            fusGrad.addColorStop(0, '#9E9E9E');
            fusGrad.addColorStop(0.3, '#E0E0E0');
            fusGrad.addColorStop(0.7, '#E0E0E0');
            fusGrad.addColorStop(1, '#9E9E9E');
            ctx.fillStyle = fusGrad;
            
            ctx.beginPath();
            ctx.ellipse(0, 0, 58, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cockpit windows
            ctx.fillStyle = '#81D4FA';
            ctx.beginPath();
            ctx.ellipse(22, -2, 14, 8, 0.2, 0, Math.PI * 2);
            ctx.fill();
            
            // Wings
            ctx.fillStyle = '#757575';
            // Left wing
            ctx.beginPath();
            ctx.moveTo(-5, 3);
            ctx.lineTo(-45, 28);
            ctx.lineTo(-40, 33);
            ctx.lineTo(-5, 12);
            ctx.closePath();
            ctx.fill();
            // Right wing  
            ctx.beginPath();
            ctx.moveTo(-5, -3);
            ctx.lineTo(-45, -28);
            ctx.lineTo(-40, -33);
            ctx.lineTo(-5, -12);
            ctx.closePath();
            ctx.fill();
            
            // Tail
            ctx.fillStyle = '#616161';
            ctx.beginPath();
            ctx.moveTo(-52, 0);
            ctx.lineTo(-68, -18);
            ctx.lineTo(-58, -18);
            ctx.lineTo(-52, 0);
            ctx.closePath();
            ctx.fill();
            
            // Propeller (when throttle > 0)
            if(plane.throttle > 5) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                const propSpeed = Date.now() * 0.04 * (plane.throttle / 50);
                ctx.beginPath();
                ctx.moveTo(58, -18 * Math.cos(propSpeed));
                ctx.lineTo(58, 18 * Math.cos(propSpeed));
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(58 + 18 * Math.sin(propSpeed), 0);
                ctx.lineTo(58 - 18 * Math.sin(propSpeed), 0);
                ctx.stroke();
            }
            
            // Engine glow
            if(plane.throttle > 20) {
                const glowGrad = ctx.createRadialGradient(58, 0, 0, 58, 0, 20);
                glowGrad.addColorStop(0, `rgba(255,${150 - plane.throttle},0,${plane.throttle/100})`);
                glowGrad.addColorStop(1, 'rgba(255,50,0,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(58, 0, 20, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
        }
        
        // Update physics
        function updatePhysics(dt) {
            gameTime += dt;
            
            // Input
            if(keys['w']) plane.throttle = Math.min(100, plane.throttle + 40 * dt);
            if(keys['s']) plane.throttle = Math.max(0, plane.throttle - 40 * dt);
            
            // Pitch control
            if(keys['arrowup']) plane.pitch = Math.min(25, plane.pitch + 12 * dt);
            if(keys['arrowdown']) plane.pitch = Math.max(-15, plane.pitch - 12 * dt);
            
            // Auto level pitch slightly
            if(!keys['arrowup'] && !keys['arrowdown']) {
                plane.pitch *= 0.97;
            }
            
            // Roll based on pitch (banking)
            plane.roll = plane.pitch * 0.8;
            
            // Physics
            // Thrust affects speed
            const targetSpeed = plane.throttle * 1.8;
            plane.speed += (targetSpeed - plane.speed) * 0.8 * dt;
            plane.speed = Math.max(0, plane.speed);
            
            // Speed affects altitude based on pitch
            const climbRate = (plane.pitch * 1.5 + plane.throttle * 0.2) * (plane.speed / 50);
            plane.altitude += climbRate * dt * 15;
            plane.altitude = Math.max(0, plane.altitude);
            
            // Distance
            plane.distance += plane.speed * dt * 0.5;
            
            // Phase logic
            updatePhase();
            
            // Update HUD
            updateHUD();
        }
        
        // Update flight phase
        function updatePhase() {
            const alt = plane.altitude;
            const spd = plane.speed;
            const dist = plane.distance;
            const progress = Math.min(100, (dist / 1500) * 100);
            
            // Determine phase
            if (alt < 5 && spd < 30) {
                flightPhase = PHASE.TAXI;
                document.getElementById('phaseText').textContent = '🚦 滑行 - 按W加速';
            } else if (alt < 30 && spd >= 30) {
                flightPhase = PHASE.TAKEOFF;
                document.getElementById('phaseText').textContent = '✈️ 起飞 - 拉起机头 ↑';
            } else if (alt < 150) {
                flightPhase = PHASE.CLIMB;
                document.getElementById('phaseText').textContent = '🛫 爬升 - 保持油门';
            } else if (alt >= 150 && alt < 600 && dist < 1200) {
                flightPhase = PHASE.CRUISE;
                document.getElementById('phaseText').textContent = '✈️ 巡航 - 欣赏风景';
            } else if (dist >= 1200 && alt > 150) {
                flightPhase = PHASE.DESCENT;
                document.getElementById('phaseText').textContent = '🛬 下降 - 减小油门';
            } else if (alt <= 100 && alt > 30 && spd > 50) {
                flightPhase = PHASE.APPROACH;
                document.getElementById('phaseText').textContent = '📍 进近 - 对准跑道';
            } else if (alt <= 30 && spd > 30) {
                flightPhase = PHASE.LANDING;
                document.getElementById('phaseText').textContent = '🛬 降落 - 保持低速';
            } else if (alt < 10 && spd <= 30) {
                flightPhase = PHASE.ROLLOUT;
                document.getElementById('phaseText').textContent = '🛌 滑行 - 减速';
            }
            
            // Progress bar
            document.getElementById('progressBar').style.width = progress + '%';
            
            // Messages
            if(flightPhase === PHASE.TAKEOFF && alt > 50) {
                showMessage('起飞成功！✈️');
            } else if(flightPhase === PHASE.CRUISE && alt > 300) {
                showMessage('到达巡航高度 🌤️');
            } else if(flightPhase === PHASE.DESCENT) {
                showMessage('开始下降 ↓');
            } else if(flightPhase === PHASE.LANDING && alt < 20) {
                showMessage('即将降落 🛬');
            }
            
            // Warnings
            const pitchEl = document.getElementById('pitchVal');
            if(flightPhase === PHASE.LANDING && spd > 70) {
                showMessage('⚠️ 速度太快！减速！', true);
            } else if(flightPhase === PHASE.TAKEOFF && alt < 20 && spd > 80) {
                showMessage('⚠️ 抬头过早！', true);
            }
            
            // End game
            if(flightPhase === PHASE.ROLLOUT && spd < 5 && plane.distance > 200) {
                gameOver(true);
            }
            
            // Crash check
            if(flightPhase === PHASE.LANDING && alt > 10 && spd > 90) {
                // Too fast landing
            }
        }
        
        function showMessage(text, isWarning = false) {
            const msgEl = document.getElementById('gameMessage');
            msgEl.textContent = text;
            msgEl.className = isWarning ? 'show warning' : 'show';
            setTimeout(() => msgEl.className = '', 2500);
        }
        
        function updateHUD() {
            document.getElementById('throttleVal').textContent = Math.round(plane.throttle);
            document.getElementById('throttleBar').style.width = plane.throttle + '%';
            
            // Pitch: -15 to +25, map to 0-100%
            const pitchPct = ((plane.pitch + 15) / 40) * 100;
            document.getElementById('pitchVal').textContent = Math.round(plane.pitch);
            document.getElementById('pitchBar').style.width = pitchPct + '%';
            
            document.getElementById('speedVal').textContent = Math.round(plane.speed);
            document.getElementById('altVal').textContent = Math.round(plane.altitude);
        }
        
        // Game loop
        function gameLoop(timestamp) {
            if(!gameRunning) return;
            
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawSky();
            drawClouds();
            drawGround();
            drawPlane();
            
            updatePhysics(dt);
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            gameRunning = true;
            gameTime = 0;
            flightPhase = PHASE.TAXI;
            
            plane.x = 100;
            plane.altitude = 0;
            plane.speed = 0;
            plane.throttle = 0;
            plane.pitch = 0;
            plane.roll = 0;
            plane.distance = 0;
            
            initWorld();
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hudLeft').style.display = 'block';
            document.getElementById('hudRight').style.display = 'block';
            document.getElementById('bottomPanel').style.display = 'block';
            
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }
        
        function gameOver(success) {
            gameRunning = false;
            
            const mins = Math.floor(gameTime / 60);
            const secs = Math.floor(gameTime % 60);
            document.getElementById('finalTime').textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
            document.getElementById('endSubtitle').textContent = success ? '成功降落！🛬' : '坠毁...💥';
            
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        // Init
        initWorld();
        drawSky();
        drawClouds();
        drawGround();
        drawPlane();
    </script>
</body>
</html>
